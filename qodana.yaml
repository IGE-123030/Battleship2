# Configuração de inspeções baseada no livro Lanza & Marinescu
version: "1.0"

linter: jetbrains/qodana-jvm

include:
  # Aqui usa-se "name:"
  - name: Java | Class metrics | Overly complex class
  - name: Java | Class metrics | Class with too many methods
  - name: Java | Class metrics | Class with too many fields
  - name: OverlyCoupledMethod

profile:
  name: QodanaQualityGates
  inspections:
    # --- Configurações dos teus amigos
    - inspection: OverlyComplexClass
      severity: ERROR
      options:
        m_limit: 47
    - inspection: ClassWithTooManyMethods
      severity: WARNING
      options:
        m_limit: 25
    - inspection: ClassWithTooManyFields
      severity: WARNING
      options:
        m_limit: 14

    # --- A tua configuração ---
    - inspection: OverlyCoupledMethod
      severity: ERROR
      options:
        # Define o número máximo de ligações/acoplamentos do teu método a outras classes
        m_limit: 10

failureConditions:
  severityThresholds:
    any: 1